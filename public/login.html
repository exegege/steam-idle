<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - IdleSteam</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <a href="/" class="auth-logo">
            🎮 <span>Idle<span>Steam</span></span>
        </a>

        <h1>Welcome Back</h1>

        <p class="auth-description">
            Login untuk mengakses dashboard IdleSteam.
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="nama@email.com"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Masukkan password"
                required
            >

            <button type="submit" class="auth-button">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Belum punya akun?
            <a href="register.html">Register</a>
        </p>

        <a href="/" class="back-home">
            ← Kembali ke halaman utama
        </a>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
