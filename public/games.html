<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Games - IdleSteam</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            🎮 Idle<span>Steam</span>
        </div>

        <div class="menu-title">
            MENU
        </div>

        <a href="dashboard.html" class="menu-item">
            🏠
            <span>Dashboard</span>
        </a>

        <a href="games.html" class="menu-item active">
            🎮
            <span>My Games</span>
        </a>

        <a href="#" class="menu-item">
            ⚡
            <span>Idle Session</span>
        </a>

        <a href="#" class="menu-item">
            🖥️
            <span>Server Status</span>
        </a>

        <div class="menu-title">
            ACCOUNT
        </div>

        <a href="#" class="menu-item">
            ⚙️
            <span>Settings</span>
        </a>

        <a href="/" class="menu-item logout">
            🚪
            <span>Logout</span>
        </a>

    </aside>


    <main class="dashboard-content">

        <header class="dashboard-header">

            <div>

                <small>GAMES</small>

                <h1>My Games</h1>

            </div>

            <a href="#"
               class="btn-primary"
               onclick="showAddGame()">
                + Add Game
            </a>

        </header>


        <div class="games-empty">

    <div class="empty-icon">
        🎮
    </div>

    <h2>Loading Games...</h2>

    <p>
        Memuat daftar game kamu.
    </p>

</div>


        <!-- ADD GAME -->

        <div id="addGameModal" class="modal">

            <div class="modal-content">

                <button
                    class="modal-close"
                    onclick="hideAddGame()">
                    ×
                </button>

                <h2>Add Steam Game</h2>

                <p>
                    Masukkan informasi game.
                </p>

                <label>Game Name</label>

                <input
                    type="text"
                    id="gameName"
                    placeholder="Contoh: Counter-Strike 2">

                <label>Steam App ID</label>

                <input
                    type="text"
                    id="appId"
                    placeholder="Contoh: 730">

                <button
                    class="auth-button"
                    onclick="addGame()">

                    Add Game

                </button>

            </div>

        </div>

    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
